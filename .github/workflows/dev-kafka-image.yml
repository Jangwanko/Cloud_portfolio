name: Dev Kafka Image

on:
  push:
    branches: [dev-kafka]

permissions:
  contents: write
  packages: write

jobs:
  build-and-update-gitops:
    if: ${{ !contains(github.event.head_commit.message, '[skip dev-kafka image]') }}
    runs-on: ubuntu-latest

    env:
      IMAGE_NAME: ghcr.io/jangwanko/cloud_portfolio
      KUSTOMIZATION: k8s/gitops/overlays/local-ha/kustomization.yaml

    steps:
      - name: Checkout dev-kafka
        uses: actions/checkout@v4
        with:
          ref: dev-kafka
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image tag
        id: image
        shell: bash
        run: |
          short_sha="${GITHUB_SHA::7}"
          echo "tag=${short_sha}" >> "$GITHUB_OUTPUT"
          echo "image=${IMAGE_NAME}:${short_sha}" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.image }}
            ghcr.io/jangwanko/cloud_portfolio:dev-kafka-latest

      - name: Update GitOps image tag
        shell: bash
        run: |
          sudo curl -sSL -o /usr/local/bin/yq https://github.com/mikefarah/yq/releases/download/v4.44.3/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
          yq -i '(.images[] | select(.name == "messaging-portfolio") | .newName) = "ghcr.io/jangwanko/cloud_portfolio"' "$KUSTOMIZATION"
          yq -i '(.images[] | select(.name == "messaging-portfolio") | .newTag) = "${{ steps.image.outputs.tag }}"' "$KUSTOMIZATION"

      - name: Commit GitOps image tag
        shell: bash
        run: |
          if git diff --quiet "$KUSTOMIZATION"; then
            echo "GitOps image tag already points to ${{ steps.image.outputs.tag }}"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$KUSTOMIZATION"
          git commit -m "ci: update dev-kafka image to ${{ steps.image.outputs.tag }} [skip dev-kafka image]"
          git push origin HEAD:dev-kafka
