global:
  security:
    allowInsecureImages: true

postgresql:
  replicaCount: 1
  # Keep the chart's checks; isolate and remove each probe's NSS temporary files.
  customLivenessProbe:
    exec:
      command:
        - /bin/bash
        - -ec
        - &probeCleanup |
          probe_tmp="$(mktemp -d /tmp/pg-probe.XXXXXXXXXX)"
          trap 'rm -rf -- "$probe_tmp"' EXIT
          export TMPDIR="$probe_tmp"
          /bin/bash "$1"
        - pg-probe
        - /liveness-probe.sh
    initialDelaySeconds: 15
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 6
    successThreshold: 1
  customReadinessProbe:
    exec:
      command:
        - /bin/bash
        - -ec
        - *probeCleanup
        - pg-probe
        - /readiness-probe.sh
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 6
    successThreshold: 1
  image:
    registry: docker.io
    repository: bitnamilegacy/postgresql-repmgr
    tag: 17.6.0-debian-12-r2
  username: portfolio
  database: portfolio
  # Passwords are generated in the chart-managed Secret on first install and
  # reused from that Secret during upgrades. Do not commit demo credentials.
  syncReplication: false
  numSynchronousReplicas: 0
  podAntiAffinityPreset: soft
  pdb:
    create: false
  resources:
    requests:
      cpu: 200m
      memory: 384Mi
    limits:
      cpu: 750m
      memory: 768Mi

pgpool:
  replicaCount: 1
  image:
    registry: docker.io
    repository: bitnamilegacy/pgpool
    tag: 4.6.3-debian-12-r0
  adminUsername: admin
  podAntiAffinityPreset: soft
  pdb:
    create: false
  numInitChildren: 16
  maxPool: 1
  childMaxConnections: 50
  reservedConnections: 2
  childLifeTime: 300
  clientIdleLimit: 60
  connectionLifeTime: 300
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

persistence:
  enabled: true
  size: 4Gi

metrics:
  enabled: false
