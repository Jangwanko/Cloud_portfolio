apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
images:
  - name: messaging-portfolio
    newName: ghcr.io/jangwanko/cloud_portfolio
    newTag: a9a02ddd63a2
patches:
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: api
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: GENERIC_EVENTS_V2_ENABLED
          value: "true"
