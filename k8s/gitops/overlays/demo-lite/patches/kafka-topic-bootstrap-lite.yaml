apiVersion: batch/v1
kind: Job
metadata:
  name: kafka-topic-bootstrap
  namespace: messaging-app
spec:
  template:
    spec:
      containers:
        - name: topic-bootstrap
          command:
            - sh
            - -c
            - |
              set -eu
              bootstrap="kafka.messaging-app.svc.cluster.local:9092"
              until /opt/kafka/bin/kafka-topics.sh --bootstrap-server "$bootstrap" --list >/dev/null 2>&1; do
                sleep 3
              done
              /opt/kafka/bin/kafka-topics.sh --bootstrap-server "$bootstrap" --create --if-not-exists --topic message-ingress --partitions 3 --replication-factor 1 --config min.insync.replicas=1
              /opt/kafka/bin/kafka-topics.sh --bootstrap-server "$bootstrap" --create --if-not-exists --topic message-ingress-dlq --partitions 3 --replication-factor 1 --config min.insync.replicas=1
              /opt/kafka/bin/kafka-topics.sh --bootstrap-server "$bootstrap" --create --if-not-exists --topic message-request-status --partitions 3 --replication-factor 1 --config min.insync.replicas=1 --config cleanup.policy=compact
              /opt/kafka/bin/kafka-topics.sh --bootstrap-server "$bootstrap" --create --if-not-exists --topic message-snapshots --partitions 3 --replication-factor 1 --config min.insync.replicas=1 --config cleanup.policy=compact
              /opt/kafka/bin/kafka-topics.sh --bootstrap-server "$bootstrap" --create --if-not-exists --topic stream-snapshots --partitions 3 --replication-factor 1 --config min.insync.replicas=1 --config cleanup.policy=compact
              /opt/kafka/bin/kafka-topics.sh --bootstrap-server "$bootstrap" --create --if-not-exists --topic message-notifications --partitions 3 --replication-factor 1 --config min.insync.replicas=1
