apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../demo-lite

images:
  - name: messaging-portfolio
    newName: ghcr.io/jangwanko/cloud_portfolio
    newTag: 664693b44207

patches:
  - path: patches/api-generic-v2-k3s.yaml
  - path: patches/messaging-env-k3s.yaml
  - path: patches/ingress-api-k3s.yaml
    target:
      group: networking.k8s.io
      version: v1
      kind: Ingress
      name: api
      namespace: messaging-app
  - path: patches/ingress-grafana-k3s.yaml
    target:
      group: networking.k8s.io
      version: v1
      kind: Ingress
      name: grafana
      namespace: messaging-app
  - path: patches/ingress-prometheus-k3s.yaml
    target:
      group: networking.k8s.io
      version: v1
      kind: Ingress
      name: prometheus
      namespace: messaging-app
