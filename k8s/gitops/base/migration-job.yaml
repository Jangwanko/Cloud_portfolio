apiVersion: batch/v1
kind: Job
metadata:
  name: messaging-schema-migration
  namespace: messaging-app
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
    argocd.argoproj.io/sync-options: Force=true,Replace=true
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        app: messaging-schema-migration
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: messaging-portfolio:local
          imagePullPolicy: IfNotPresent
          command:
            - python
            - -c
            - from portfolio.db import run_alembic_migrations; run_alembic_migrations()
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          envFrom:
            - secretRef:
                name: messaging-env
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: messaging-postgresql-ha-postgresql
                  key: password
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
      volumes:
        - name: tmp
          emptyDir: {}
