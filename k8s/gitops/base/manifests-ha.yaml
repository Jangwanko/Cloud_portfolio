apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-exporter
  namespace: messaging-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka-exporter
  template:
    metadata:
      labels:
        app: kafka-exporter
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: kafka-exporter
          image: danielqsj/kafka-exporter:v1.7.0
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          args:
            - --kafka.server=kafka.messaging-app.svc.cluster.local:9092
            - --web.listen-address=:9308
            - --topic.filter=message-.*
            - --group.filter=(message-.*|notification-worker)
          ports:
            - name: metrics
              containerPort: 9308
          readinessProbe:
            tcpSocket:
              port: metrics
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            tcpSocket:
              port: metrics
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: kafka-exporter
  namespace: messaging-app
spec:
  selector:
    app: kafka-exporter
  ports:
    - name: metrics
      port: 9308
      targetPort: 9308
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: messaging-app
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s
      evaluation_interval: 5s

    rule_files:
      - /etc/prometheus/alerts.yml

    scrape_configs:
      - job_name: api
        metrics_path: /metrics
        dns_sd_configs:
          - names: ["api-metrics.messaging-app.svc.cluster.local"]
            type: A
            port: 8000
            refresh_interval: 15s

      - job_name: worker
        metrics_path: /metrics
        dns_sd_configs:
          - names: ["worker.messaging-app.svc.cluster.local"]
            type: A
            port: 9101
            refresh_interval: 15s

      - job_name: notification-worker
        metrics_path: /metrics
        dns_sd_configs:
          - names: ["notification-worker.messaging-app.svc.cluster.local"]
            type: A
            port: 9101
            refresh_interval: 15s

      - job_name: dlq-replayer
        metrics_path: /metrics
        dns_sd_configs:
          - names: ["dlq-replayer.messaging-app.svc.cluster.local"]
            type: A
            port: 9102
            refresh_interval: 15s

      - job_name: kafka-exporter
        metrics_path: /metrics
        static_configs:
          - targets: ["kafka-exporter:9308"]

      - job_name: kube-state-metrics
        metrics_path: /metrics
        static_configs:
          - targets: ["kube-state-metrics:8080"]
  alerts.yml: |
    groups:
      - name: messaging-critical
        rules:
          - alert: MessagingKafkaDown
            expr: messaging_health_status{job="api",component="kafka"} == 0
            labels:
              severity: critical
              service: messaging
            annotations:
              summary: "Kafka unavailable"
              description: "Kafka bootstrap is unavailable, so event intake cannot append to the replicated event log."

          - alert: MessagingMetricsTargetMissing
            expr: |
              (up{job=~"api|worker|dlq-replayer|kafka-exporter"} == 0)
              or absent(up{job="api"})
              or absent(up{job="worker"})
              or absent(up{job="dlq-replayer"})
              or absent(up{job="kafka-exporter"})
            for: 2m
            labels:
              severity: critical
              service: messaging
            annotations:
              summary: "Required metrics target missing"
              description: "Prometheus cannot scrape a required application or Kafka exporter target."

          - alert: MessagingDbDown
            expr: messaging_health_status{job="api",component="db"} == 0
            labels:
              severity: critical
              service: messaging
            annotations:
              summary: "PostgreSQL primary unavailable"
              description: "Writable PostgreSQL primary is unavailable. Kafka intake may continue if the broker is reachable, but persistence is blocked until PostgreSQL recovers."

          - alert: MessagingApiHigh5xxRate
            expr: |
              (
                (sum(rate(messaging_api_requests_total{status=~"5.."}[5m])) or vector(0))
                /
                clamp_min((sum(rate(messaging_api_requests_total[5m])) or vector(0)), 0.001)
              ) > 0.05
            for: 5m
            labels:
              severity: critical
              service: messaging
            annotations:
              summary: "High API 5xx rate"
              description: "API 5xx ratio is above 5% for 5 minutes."

          - alert: MessagingApiP95LatencyCritical
            expr: |
              histogram_quantile(
                0.95,
                sum by (le) (rate(messaging_api_request_latency_seconds_bucket[5m]))
              ) > 4
            for: 5m
            labels:
              severity: critical
              service: messaging
            annotations:
              summary: "API p95 latency critical"
              description: "API p95 latency is above 4 seconds for 5 minutes."

          - alert: MessagingEventPersistLagCritical
            expr: |
              histogram_quantile(
                0.95,
                sum by (le) (rate(messaging_event_persist_lag_seconds_bucket[5m]))
              ) > 15
            for: 5m
            labels:
              severity: critical
              service: messaging
            annotations:
              summary: "Accepted-to-persisted lag critical"
              description: "Event persistence p95 lag is above 15 seconds for 5 minutes."

          - alert: MessagingQueueWaitCritical
            expr: |
              histogram_quantile(
                0.95,
                sum by (le) (rate(messaging_queue_wait_seconds_bucket[5m]))
              ) > 30
            for: 5m
            labels:
              severity: critical
              service: messaging
            annotations:
              summary: "Kafka topic wait critical"
              description: "Queue wait p95 is above 30 seconds for 5 minutes."

          - alert: MessagingDlqReplayBlocked
            expr: sum(messaging_dlq_replay_total{result="skipped_max_replay"}) > 0
            for: 0m
            labels:
              severity: critical
              service: messaging
            annotations:
              summary: "DLQ replay blocked by max replay guard"
              description: "At least one DLQ event reached DLQ_REPLAY_MAX_COUNT since the DLQ replayer process started and was excluded from automatic replay."

          - alert: MessagingKafkaExporterDown
            expr: up{job="kafka-exporter"} == 0
            for: 1m
            labels:
              severity: critical
              service: messaging
            annotations:
              summary: "Kafka exporter unavailable"
              description: "Prometheus cannot scrape kafka-exporter, so broker/topic/consumer group lag visibility is unavailable."

      - name: messaging-warning
        rules:
          - alert: MessagingPostgresDegraded
            expr: |
              (
                messaging_postgres_standby_count{job="api"} <= 1
                or sum(messaging_postgres_replication_state_count{job="api",state!="streaming"}) > 0
                or messaging_postgres_replication_delay_bytes_max{job="api"} > 1048576
              )
            for: 30s
            labels:
              severity: warning
              service: messaging
            annotations:
              summary: "PostgreSQL replication degraded"
              description: "PostgreSQL primary is still reachable, but standby count, replication state, or lag are outside the local demo ready-state target."

          - alert: MessagingWorkerUnhealthy
            expr: messaging_health_status{component="worker"} == 0
            for: 2m
            labels:
              severity: warning
              service: messaging
            annotations:
              summary: "Worker unhealthy"
              description: "Worker health status is down for over 2 minutes."

          - alert: MessagingWorkerFailureRateHigh
            expr: |
              (
                (sum(rate(messaging_worker_processed_total{result="failure"}[5m])) or vector(0))
                /
                clamp_min((sum(rate(messaging_worker_processed_total[5m])) or vector(0)), 0.001)
              ) > 0.1
            for: 5m
            labels:
              severity: warning
              service: messaging
            annotations:
              summary: "Worker failure rate high"
              description: "Worker failure ratio is above 10% for 5 minutes."

          - alert: MessagingApiP95LatencyHigh
            expr: |
              histogram_quantile(
                0.95,
                sum by (le) (rate(messaging_api_request_latency_seconds_bucket[5m]))
              ) > 2
            for: 10m
            labels:
              severity: warning
              service: messaging
            annotations:
              summary: "API p95 latency high"
              description: "API p95 latency is above 2 seconds for 10 minutes."

          - alert: MessagingApi5xxRateWarning
            expr: |
              (
                (sum(rate(messaging_api_requests_total{status=~"5.."}[5m])) or vector(0))
                /
                clamp_min((sum(rate(messaging_api_requests_total[5m])) or vector(0)), 0.001)
              ) > 0.01
            for: 5m
            labels:
              severity: warning
              service: messaging
            annotations:
              summary: "API 5xx rate warning"
              description: "API 5xx ratio is above 1% for 5 minutes."

          - alert: MessagingEventPersistLagHigh
            expr: |
              histogram_quantile(
                0.95,
                sum by (le) (rate(messaging_event_persist_lag_seconds_bucket[5m]))
              ) > 5
            for: 5m
            labels:
              severity: warning
              service: messaging
            annotations:
              summary: "Accepted-to-persisted lag high"
              description: "Event persistence p95 lag is above 5 seconds for 5 minutes."

          - alert: MessagingQueueWaitHigh
            expr: |
              histogram_quantile(
                0.95,
                sum by (le) (rate(messaging_queue_wait_seconds_bucket[5m]))
              ) > 10
            for: 5m
            labels:
              severity: warning
              service: messaging
            annotations:
              summary: "Kafka topic wait high"
              description: "Queue wait p95 is above 10 seconds for 5 minutes."

          - alert: MessagingKafkaConsumerLagHigh
            expr: sum(clamp_min(kafka_consumergroup_lag{consumergroup="message-worker"}, 0)) > 100
            for: 5m
            labels:
              severity: warning
              service: messaging
            annotations:
              summary: "Kafka consumer group lag high"
              description: "message-worker consumer group lag is above 100 messages for 5 minutes."

          - alert: MessagingNotificationConsumerLagHigh
            expr: sum(clamp_min(kafka_consumergroup_lag{consumergroup="notification-worker"}, 0)) > 100
            for: 5m
            labels:
              severity: warning
              service: messaging
            annotations:
              summary: "Notification consumer lag high"
              description: "notification-worker consumer group lag is above 100 messages for 5 minutes."

          - alert: MessagingWorkerLastSuccessStale
            expr: |
              (
                (sum(clamp_min(kafka_consumergroup_lag{consumergroup="message-worker"}, 0)) > 0)
                and
                (time() - max(messaging_worker_last_success_timestamp{job="worker"}) > 60)
              )
            for: 2m
            labels:
              severity: warning
              service: messaging
            annotations:
              summary: "Worker success timestamp stale"
              description: "Worker has pending consumer lag but no successful event for over 60 seconds."

          - alert: MessagingDlqEventsIncreasing
            expr: sum(increase(messaging_dlq_events_total[5m])) > 0
            for: 0m
            labels:
              severity: warning
              service: messaging
            annotations:
              summary: "DLQ events increasing"
              description: "At least one event was moved to the Kafka DLQ in the last 5 minutes."

          - alert: MessagingPodRestarting
            expr: sum by (pod, container) (increase(kube_pod_container_status_restarts_total{namespace="messaging-app"}[15m])) > 0
            for: 0m
            labels:
              severity: warning
              service: messaging
            annotations:
              summary: "Messaging pod restarted"
              description: "A messaging-app pod/container restarted in the last 15 minutes."

          - alert: MessagingDeploymentUnavailableReplicas
            expr: kube_deployment_status_replicas_unavailable{namespace="messaging-app"} > 0
            for: 2m
            labels:
              severity: warning
              service: messaging
            annotations:
              summary: "Deployment has unavailable replicas"
              description: "A messaging-app deployment has unavailable replicas for over 2 minutes."
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: messaging-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
      annotations:
        portfolio.jangwanko.dev/config-hash: "964b227076466205"
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: prometheus
          image: prom/prometheus:v2.54.1
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --web.external-url=http://localhost/prometheus/
            - --web.route-prefix=/prometheus/
          ports:
            - name: http
              containerPort: 9090
          readinessProbe:
            httpGet:
              path: /prometheus/-/ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /prometheus/-/healthy
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "768Mi"
          volumeMounts:
            - name: prometheus-config
              mountPath: /etc/prometheus
      volumes:
        - name: prometheus-config
          configMap:
            name: prometheus-config
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: messaging-app
spec:
  selector:
    app: prometheus
  ports:
    - name: http
      port: 9090
      targetPort: 9090
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: prometheus
  namespace: messaging-app
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - localhost
      secretName: messaging-local-tls
  rules:
    - host: localhost
      http:
        paths:
          - path: /prometheus
            pathType: Prefix
            backend:
              service:
                name: prometheus
                port:
                  number: 9090
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-provisioning
  namespace: messaging-app
data:
  datasource.yml: |
    apiVersion: 1

    datasources:
      - name: Prometheus
        uid: prometheus
        type: prometheus
        access: proxy
        url: http://prometheus:9090/prometheus
        isDefault: true
        editable: false
  dashboard.yml: |
    apiVersion: 1

    providers:
      - name: Reliable Event Processing
        orgId: 1
        folder: Reliable Event Processing
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards
