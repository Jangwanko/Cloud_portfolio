apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-backups
  namespace: messaging-app
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-weekly-backup
  namespace: messaging-app
spec:
  schedule: "0 3 * * 0"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      template:
        spec:
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            runAsGroup: 1001
            fsGroup: 1001
            seccompProfile:
              type: RuntimeDefault
          restartPolicy: OnFailure
          containers:
            - name: postgres-backup
              image: bitnamilegacy/postgresql-repmgr:17.6.0-debian-12-r2
              imagePullPolicy: IfNotPresent
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              resources:
                requests:
                  cpu: "100m"
                  memory: "128Mi"
                limits:
                  cpu: "500m"
                  memory: "512Mi"
              env:
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: messaging-postgresql-ha-postgresql
                      key: password
              command:
                - sh
                - -c
                - |
                  set -eu
                  timestamp="$(date +%Y%m%d-%H%M%S)"
                  output="/backups/postgres-${timestamp}.sql"
                  pg_dump -h messaging-postgresql-ha-pgpool -p 5432 -U portfolio -d portfolio > "$output"
                  find /backups -type f -name 'postgres-*.sql' | sort | head -n -8 | xargs -r rm -f
                  echo "Weekly PostgreSQL backup written to $output"
              volumeMounts:
                - name: postgres-backups
                  mountPath: /backups
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: postgres-backups
              persistentVolumeClaim:
                claimName: postgres-backups
            - name: tmp
              emptyDir: {}
---
