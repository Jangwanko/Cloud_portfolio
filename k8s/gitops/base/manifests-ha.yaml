apiVersion: v1
kind: Secret
metadata:
  name: messaging-env
  namespace: messaging-app
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
type: Opaque
stringData:
  APP_ENV: "k8s-ha"
  REQUEST_BODY_MAX_BYTES: "1048576"
  DEMO_RESET_ENABLED: "true"
  GENERIC_EVENTS_V2_ENABLED: "false"
  DB_HOST: "messaging-postgresql-ha-pgpool.messaging-app.svc.cluster.local"
  DB_PORT: "5432"
  DB_NAME: "portfolio"
  DB_USER: "portfolio"
  KAFKA_BOOTSTRAP_SERVERS: "kafka.messaging-app.svc.cluster.local:9092"
  KAFKA_INGRESS_TOPIC: "message-ingress"
  KAFKA_DLQ_TOPIC: "message-ingress-dlq"
  KAFKA_REQUEST_STATUS_TOPIC: "message-request-status"
  KAFKA_MESSAGE_SNAPSHOT_TOPIC: "message-snapshots"
  KAFKA_STREAM_SNAPSHOT_TOPIC: "stream-snapshots"
  KAFKA_NOTIFICATION_TOPIC: "message-notifications"
  KAFKA_NOTIFICATION_CONSUMER_GROUP: "notification-worker"
  KAFKA_CONSUMER_GROUP: "message-worker"
  DLQ_REPLAY_MAX_COUNT: "3"
  STARTUP_RETRIES: "30"
  STARTUP_RETRY_DELAY: "2"
  DB_POOL_MIN_CONN: "1"
  DB_POOL_MAX_CONN: "8"
  DB_CONNECT_TIMEOUT: "3"
  READINESS_DEGRADED_GRACE_SECONDS: "30"
  POSTGRES_MIN_READY_STANDBYS: "2"
  POSTGRES_MIN_SYNC_STANDBYS: "1"
  POSTGRES_REPLICATION_DELAY_DEGRADED_BYTES: "1048576"
  UVICORN_WORKERS: "1"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: messaging-app
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  replicas: 6
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: messaging-portfolio:local
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          command:
            - sh
            - -c
            - exec python -m uvicorn portfolio.main:app --host 0.0.0.0 --port 8000 --workers ${UVICORN_WORKERS:-2}
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: messaging-env
            - secretRef:
                name: messaging-runtime-secrets
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: messaging-postgresql-ha-postgresql
                  key: password
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: "300m"
              memory: "384Mi"
            limits:
              cpu: "1000m"
              memory: "768Mi"
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8000
            initialDelaySeconds: 10
            timeoutSeconds: 5
            periodSeconds: 5
          startupProbe:
            httpGet:
              path: /health/live
              port: 8000
            initialDelaySeconds: 10
            timeoutSeconds: 5
            periodSeconds: 5
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8000
            initialDelaySeconds: 60
            timeoutSeconds: 5
            periodSeconds: 10
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: messaging-app
spec:
  selector:
    app: api
  ports:
    - name: http
      port: 8000
      targetPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: api-metrics
  namespace: messaging-app
spec:
  clusterIP: None
  selector:
    app: api
  ports:
    - name: metrics
      port: 8000
      targetPort: 8000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api
  namespace: messaging-app
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - localhost
      secretName: messaging-local-tls
  rules:
    - host: localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: messaging-app
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: messaging-portfolio:local
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          command: ["python", "-m", "worker.main"]
          ports:
            - name: metrics
              containerPort: 9101
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: messaging-postgresql-ha-postgresql
                  key: password
          envFrom:
            - secretRef:
                name: messaging-env
            - secretRef:
                name: messaging-runtime-secrets
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "800m"
              memory: "512Mi"
          startupProbe:
            tcpSocket:
              port: metrics
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            tcpSocket:
              port: metrics
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            tcpSocket:
              port: metrics
            periodSeconds: 10
            timeoutSeconds: 3
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: worker
  namespace: messaging-app
spec:
  clusterIP: None
  selector:
    app: worker
  ports:
    - name: metrics
      port: 9101
      targetPort: 9101
---
