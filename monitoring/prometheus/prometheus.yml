global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: api
    metrics_path: /metrics
    dns_sd_configs:
      - names: ["api-metrics.messaging-app.svc.cluster.local"]
        type: A
        port: 8000
        refresh_interval: 15s

  - job_name: worker
    metrics_path: /metrics
    dns_sd_configs:
      - names: ["worker.messaging-app.svc.cluster.local"]
        type: A
        port: 9101
        refresh_interval: 15s

  - job_name: notification-worker
    metrics_path: /metrics
    dns_sd_configs:
      - names: ["notification-worker.messaging-app.svc.cluster.local"]
        type: A
        port: 9101
        refresh_interval: 15s

  - job_name: dlq-replayer
    metrics_path: /metrics
    dns_sd_configs:
      - names: ["dlq-replayer.messaging-app.svc.cluster.local"]
        type: A
        port: 9102
        refresh_interval: 15s

  - job_name: kafka-exporter
    metrics_path: /metrics
    static_configs:
      - targets: ["kafka-exporter:9308"]

  - job_name: kube-state-metrics
    metrics_path: /metrics
    static_configs:
      - targets: ["kube-state-metrics:8080"]
